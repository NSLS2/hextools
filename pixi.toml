[workspace]
requires-pixi = ">=0.82.1"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.14"
algotom = ">=1.7.0,<2"
ipython = ">=9.16.1,<10"
rich = ">=15.0.0,<16"
pyyaml = ">=6.0.3,<7"
numpy = ">=2.4.6,<3"
# ophyd-async = ">=0.21.1,<0.22"
scipy = ">=1.17.1,<2"
scikit-image = ">=0.26.0,<0.27"
h5netcdf = ">=1.8.1,<2"
nexpy = ">=2.1.0,<3"
# nslsii = ">=0.11.9,<0.12"
bluesky-tiled-plugins = ">=2.0.9,<3"

[pypi-dependencies]
hextools = { path = ".", editable = true }
nslsii = { git = "https://github.com/NSLS2/nslsii", rev = "main" }
bluesky = { git = "https://github.com/bluesky/bluesky", rev = "main" }
ophyd-async = { git = "https://github.com/bluesky/ophyd-async", rev = "main" }

[feature.profile.dependencies]
redis-json-dict = ">=0.2.2,<0.3"

[feature.qs.pypi-dependencies]
bluesky-queueserver = ">=0.0.25,<0.0.26"
bluesky-queueserver-api = ">=0.0.13,<0.0.14"
bluesky-httpserver = ">=0.0.12,<0.0.13"


[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"

[feature.terminal.dependencies]
matplotlib = ">=3.10.9,<4"
qtpy = ">=2.4.3,<3"
pyside6 = ">=6.9.0,<7"
nexpy = ">=2.0.3,<3"
pexpect = ">=4.9.0,<5"

# Install the `gui` extra (bluesky-widgets, ntnda-qt-viewer, ...) in this env.
[feature.terminal.pypi-dependencies]
hextools = { path = ".", editable = true, extras = ["gui"] }
ntnda-qt-viewer = { git = "https://github.com/jwlodek/ntnda-qt-viewer", rev = "main" }

[feature.terminal.tasks.hex-gui]
cmd = "python -m hextools.gui"
default-environment = "terminal"

[feature.terminal.tasks.qserver-gui]
cmd = "queue-monitor --http-server-uri https://xf27id1-hex-qs1.nsls2.bnl.gov:443"
default-environment = "terminal"

[feature.terminal.tasks.start]
cmd = "unset SESSION_MANAGER PYTHONPATH PYTHONUSERBASE && MPLBACKEND=qtagg ipython -i src/hextools/profiles/{{ profile }}.py"
args = [
  { arg = "mock", default = "false", choices = ["true", "false"] },
  { arg = "profile", default = "collection" },
]
env = { HEXTOOLS_RUNNING_IN_CI = "{% if mock == 'true' %}YES{% endif %}" }
default-environment = "terminal"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.dev.dependencies]
pre-commit = ">=4.6.1,<5"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-mock = ">=3.15.1,<4"
ruff = ">=0.16.2,<0.17"
ty = ">=0.0.69,<0.0.70"
pytest-asyncio = ">=1.4.0,<2"
import-linter = ">=2.13,<3"
myst-parser = ">=5.1.0,<6"
inflection = ">=0.5.1,<0.6"
pytest-timeout = ">=2.4.0,<3"
tiled-server = ">=0.2.14,<0.3"
python-build = ">=1.2.2,<2"
pyside6 = ">=6.11.1,<7"
yamale = ">=6.1.0,<7"
hdf5plugin = ">=6.0.0,<8"
h5py = ">=3.16.0,<4"
greenlet = ">=3.5.6,<4"

# Runs the profile in mock mode; mock mode needs dev-only packages (uvicorn via
# tiled-server). Sets its own env because task env does not propagate through
# `depends-on`.
[feature.dev.tasks.start-mock]
cmd = "unset SESSION_MANAGER PYTHONPATH PYTHONUSERBASE && MPLBACKEND=qtagg ipython -i src/hextools/profiles/{{ profile }}.py"
args = [{ arg = "profile", default = "collection" }]
env = { HEXTOOLS_RUNNING_IN_CI = "YES", BEAMLINE_ACRONYM = "HEX" }
default-environment = "dev"

[feature.dev.tasks.hex-gui-mock]
cmd = "python -m hextools.gui --mock"
default-environment = "dev"

# ty doesn't pick up pixi's environment from CONDA_PREFIX on its own.
[feature.dev.tasks.type-check]
cmd = "ty check --python $CONDA_PREFIX src tests"
default-environment = "dev"

[feature.exporter.tasks]
auto-exporter = "python -m hextools.exporters.auto_exporter"

[feature.exporter.dependencies]
h5py = ">=3.16.0,<4"

[feature.docs.dependencies]
sphinx = "*"
sphinx-autobuild = "*"
myst-parser = ">=5.1.0,<6"
furo = "*"
sphinx-autodoc-typehints = "*"
sphinx-copybutton = "*"

# `pixi run -e docs docs` builds to docs/_build/html; `pixi run -e docs docs true [port]` live-serves.
[feature.docs.tasks.build-docs]
cmd = "{% if serve == 'true' %}sphinx-autobuild --port {{ port }} --open-browser{% else %}sphinx-build -W --keep-going{% endif %} docs docs/_build/html"
args = [
  { arg = "serve", default = "false", choices = ["true", "false"] },
  { arg = "port", default = "8000" },
]

[environments]
# Base environments
default = { solve-group = "default" }
# Everything needed to develop, test, and run the terminal and GUI in mock mode.
dev = { features = ["profile", "terminal", "dev"], solve-group = "profile" }
docs = { features = ["docs"], solve-group = "default" }

# Profile environments (`terminal` also runs the GUI)
terminal = {features = ["profile", "terminal"], solve-group = "profile"}
qs = { features = ["profile", "qs"], solve-group = "profile" }

# Tiled webhook server that runs metadata exporters
exporter = { features = ["exporter"], solve-group = "default" }

# Python version specific environments for CI
py311 = { features = ["dev", "terminal", "py311"], solve-group = "py311" }
py312 = { features = ["dev", "terminal", "py312"], solve-group = "py312" }
py313 = { features = ["dev", "terminal", "py313"], solve-group = "py313" }

[feature.dev.tasks.tests]
cmd = "pytest --cov=src/hextools --cov-report=term"
default-environment = "dev"

# Run the tests, then serve the html coverage report whether or not they passed.
# VS Code's terminal opens file:// links in the editor, but http:// in the browser.
[feature.dev.tasks.coverage]
cmd = """
pytest --cov=src/hextools --cov-report=term --cov-report=html; \
echo "Coverage report: http://localhost:8765/index.html (Ctrl-C to stop)" \
&& python -m http.server 8765 --bind 127.0.0.1 --directory $PIXI_PROJECT_ROOT/htmlcov
"""
default-environment = "dev"

[feature.dev.tasks.lint]
cmd = "pre-commit run --all-files"
default-environment = "dev"
