---
name: Refresh Lockfile

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  update:
    name: Refresh Pixi Lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5fdf4c63feb5df02c8e3280dfd11f97246229470  # v0.10.0
        with:
          pixi-version: v0.83.0
          cache: false
          frozen: false

      - name: Run pixi update
        run: |
          echo "Automated monthly \`pixi update\` of the lockfile." > "$RUNNER_TEMP/diff.md"
          echo "" >> "$RUNNER_TEMP/diff.md"
          pixi update --json | pixi exec pixi-diff-to-markdown >> "$RUNNER_TEMP/diff.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Refresh pixi lockfile"
          author: >-
            ${{ github.event_name == 'workflow_dispatch'
              && format('{0} <{1}+{0}@users.noreply.github.com>', github.actor, github.actor_id)
              || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          title: "Refresh pixi lockfile"
          branch: pixi-update
          add-paths: pixi.lock
          body-path: ${{ runner.temp }}/diff.md
