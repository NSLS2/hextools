---
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: dev

      - name: Lint
        run: pixi run --as-is -e dev pre-commit run --all-files

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: dev

      - name: Run type checks
        run: pixi run --as-is -e dev ty check src tests

  test:
    name: Unit Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Determine pixi environment
        id: pixi
        run: echo "env=py$(echo '${{ matrix.python-version }}' | tr -d '.')" >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: ${{ steps.pixi.outputs.env }}

      - name: Run tests
        run: pixi run --as-is -e ${{ steps.pixi.outputs.env }} pytest --cov=src/hextools --cov-report=xml --cov-report=term

      # Uncomment once codecov is enabled.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v5
      #   if: ${{ matrix.python-version == '3.13' }}
      #   with:
      #     name: Coverage
      #     files: coverage.xml
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}
